services:
  postgres:
    image: postgres:16
    container_name: joyon-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - joyon_postgres_data:/var/lib/postgresql/data
    networks:
      - joyon_network

  backend-api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    container_name: joyon-backend-api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 3001
      FRONTEND_URL: ${FRONTEND_URL}
      DATABASE_URL: ${DATABASE_URL}
      DATA_SOURCE_MODE: ${DATA_SOURCE_MODE}
      AI_PROVIDER: ${AI_PROVIDER}
    depends_on:
      - postgres
    networks:
      - joyon_network

  frontend-web:
    build:
      context: ./frontend-web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
    container_name: joyon-frontend-web
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      PORT: 3000
      NEXT_PUBLIC_BASE_PATH: ${NEXT_PUBLIC_BASE_PATH}
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL}
      REVIEW_AI_BASE_URL: ${REVIEW_AI_BASE_URL}
      REVIEW_AI_API_KEY: ${REVIEW_AI_API_KEY}
      REVIEW_AI_MODEL: ${REVIEW_AI_MODEL}
    depends_on:
      - backend-api
    networks:
      - joyon_network

  nginx:
    image: nginx:1.27-alpine
    container_name: joyon-nginx
    restart: unless-stopped
    depends_on:
      - frontend-web
    ports:
      - "9979:80"
    volumes:
      - ./infra/nginx/joyon.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - joyon_network

volumes:
  joyon_postgres_data:

networks:
  joyon_network:
